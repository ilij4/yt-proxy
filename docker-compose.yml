services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-proxy-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/yt_proxy}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      METADATA_REFRESH_ENABLED: ${METADATA_REFRESH_ENABLED:-true}
      METADATA_REFRESH_INTERVAL_MS: ${METADATA_REFRESH_INTERVAL_MS:-60000}
      METADATA_REFRESH_MAX_VIDEOS_PER_RUN: ${METADATA_REFRESH_MAX_VIDEOS_PER_RUN:-200}
      METADATA_REFRESH_CONCURRENCY: ${METADATA_REFRESH_CONCURRENCY:-5}
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: yt-proxy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yt_proxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yt_proxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
